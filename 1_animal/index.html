<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--jquery-->
    <script src="js/jquery-3.7.1.min.js"></script>

    <!--swiper-->
    <script src="js/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="css/swiper-bundle.min.css">

    <script src="js/main.js"></script>
    <link rel="stylesheet" href="css/main.css">
    <title>동물보호센터</title>
</head>
<body>
    <div id="wrap">
        <!--
            PC에서 header에 fixed 클래스 추가
            PC에서 header 메뉴에 오버한 li에만 over클래스 추가

            모바일에서 메뉴열기 버튼 클릭하면 header에 menu_open클래스 추가
            모바일에서 1차메뉴를 클릭하면 클릭한 li에 open클래스 추가
        -->
        <header>
            <h1 class="logo"><a href="index.html"><span class="blind">동물보호센터</span></a></h1>
            <nav class="gnb">
                <button class="gnb_open"><span class="blind">메뉴열기</span></button>
                <div class="gnb_wrap">
                    <ul class="depth1">
                        <li >
                           <a href="https://www.animals.or.kr/"><span>찾습니다</span></a> 
                           <ul class="depth2">
                                <li><a href=""><span>실종신고</span></a></li>
                                <li><a href=""><span>구조정보/목격담</span></a></li>
                           </ul>
                        </li>
                        <li>
                            <a href="#"><span>구조분양</span></a> 
                         </li>
                         <li>
                            <a href="#"><span>네트워크</span></a> 
                            <ul class="depth2">
                                 <li><a href=""><span>동물찾기 네트워크</span></a></li>
                                 <li><a href="https://www.animal.go.kr" target="_blank" title="새창열림"><span>국가동물보호정보시스템</span></a></li>
                            </ul>
                         </li>
                         <li>
                            <a href="#"><span>재회성공담</span></a> 
                         </li>
                         <li>
                            <a href="#"><span>대처방법</span></a> 
                            <ul class="depth2">
                                 <li><a href=""><span>실종시 대처방법</span></a></li>
                                 <li><a href=""><span>구조시 대처방법</span></a></li>
                                 <li><a href=""><span>고양이에 대해</span></a></li>
                            </ul>
                         </li>
                    </ul>
                </div>
                <button class="gnb_close"><span class="blind">메뉴닫기</span></button>
            </nav>
            <div class="util">
                <div class="search">
                    <div class="search_open"><span class="blind">검색</span></div>
                </div>
            </div>
        </header>

        <main class="container">
            <section class="visual">
                <h2 class="blind">팝업</h2> <!--접근성때문에 입력해줌-->
                <div class="swiper">
                    <ul class="swiper-wrapper">
                        <li class="swiper-slide bg1">
                            <div class="wrapper">
                                <p>세상에 단 하나뿐인 가족,<br>지금 당신을 기다리고 있어요</p>
                            </div>
                        </li> 
                        <li class="swiper-slide bg2">
                            <div class="wrapper">
                                <p>사지 말고 입양하세요.<br> 진짜 가족은 입양으로 만납니다.</p>
                            </div>
                        </li>
                        <li class="swiper-slide bg3">
                            <div class="wrapper">
                                <p>당신의 품이 이 아이의<br>평생 안식처가 될 수 있어요.</p>
                            </div>
                        </li>
                    </ul>
                    <div class="btn_wrap">
                        <button class="btn_prev"><span class="blind">이전팝업보기</span></button>
                        <button class="btn_next"><span class="blind">다음팝업보기</span></button>
                        <button class="btn_stop"><span class="blind">일시정지</span></button>
                        <button class="btn_play"><span class="blind">다시시작</span></button>
                    </div>
                </div>
            </section>
            <section class="find"></section>
            <section class="slogan"></section>
            <section class="adopt"></section>
            <section class="riview"></section>
        </main>

        <footer></footer>
    </div>
</body>
</html>
